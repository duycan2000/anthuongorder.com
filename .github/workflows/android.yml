name: Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - '.github/workflows/android.yml'

permissions:
  contents: write

concurrency:
  group: android-apk
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK (preinstalled on the runner)
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "sdk.dir=$ANDROID_HOME" > android/local.properties
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build signed release APK
        working-directory: android
        env:
          VERSION_CODE: ${{ github.run_number }}
          KEYSTORE_FILE: ${{ github.workspace }}/android/signing/release.jks
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD || 'p4X_xiEwEMdHHxQMlFQ650ZB' }}
          KEY_ALIAS: atorder
        run: gradle :app:assembleRelease --no-daemon --stacktrace

      - name: Publish APK into the web app (public/download)
        run: |
          set -e
          APK=android/app/build/outputs/apk/release/app-release.apk
          ls -la "$APK"
          mkdir -p public/download
          cp "$APK" public/download/anthuongorder.apk
          SIZE=$(stat -c %s public/download/anthuongorder.apk)
          printf '{"version":"1.0.%s","build":%s,"size":%s,"built_at":"%s","sha":"%s"}\n' "${{ github.run_number }}" "${{ github.run_number }}" "$SIZE" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" "${GITHUB_SHA::7}" > public/download/apk.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/download
          git commit -m "APK build 1.0.${{ github.run_number }} [skip ci]" || exit 0
          git pull --rebase origin main
          git push origin HEAD:main

      - uses: actions/upload-artifact@v4
        with:
          name: anthuongorder-apk
          path: android/app/build/outputs/apk/release/app-release.apk
