plugins {
    id 'com.android.application'
}

def buildNo = (System.getenv('VERSION_CODE') ?: '1') as int

android {
    namespace 'com.anthuongorder.app'
    compileSdk 34

    defaultConfig {
        applicationId 'com.anthuongorder.app'
        minSdk 23
        targetSdk 34
        versionCode buildNo
        versionName "1.0.${buildNo}"
    }

    signingConfigs {
        release {
            def ks = System.getenv('KEYSTORE_FILE')
            if (ks) {
                storeFile file(ks)
                storePassword System.getenv('KEYSTORE_PASSWORD')
                keyAlias System.getenv('KEY_ALIAS') ?: 'atorder'
                keyPassword System.getenv('KEY_PASSWORD') ?: System.getenv('KEYSTORE_PASSWORD')
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig System.getenv('KEYSTORE_FILE') ? signingConfigs.release : signingConfigs.debug
        }
    }

    buildFeatures { buildConfig true }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.core:core:1.13.1'
}
